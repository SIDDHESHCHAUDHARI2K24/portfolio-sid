name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff · mypy · pytest · alembic
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://portfolio:portfolio@localhost:5432/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy app
      - name: Tests
        run: uv run pytest -q
      - name: Alembic single head
        run: |
          HEADS=$(uv run alembic heads | grep -c "(head)" || true)
          if [ "$HEADS" != "1" ]; then
            echo "::error::Expected exactly 1 alembic head, found $HEADS"
            exit 1
          fi

  frontend:
    name: Frontend — tsc · eslint · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # LayoutProps<"/"> and friends are generated globals (.next/types);
      # a fresh checkout has no .next, so generate before tsc.
      - name: Generate Next types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint (error-free; warning budget pinned to current baseline)
        run: npm run lint -- --max-warnings=5
      - name: Unit tests
        run: npm test

  admin:
    name: Admin — tsc · oxlint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  contract:
    name: Contract — OpenAPI drift · registries
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync backend deps
        run: uv sync --frozen
        working-directory: backend
      - name: OpenAPI drift check
        working-directory: backend
        run: |
          uv run python scripts/export_openapi.py
          if ! git diff --exit-code openapi.json; then
            echo "::error::openapi.json is stale. Run: cd backend && uv run python scripts/export_openapi.py, then regenerate api.d.ts in frontend and admin."
            exit 1
          fi
      - name: Feature registries check
        run: python3 scripts/check_registries.py
