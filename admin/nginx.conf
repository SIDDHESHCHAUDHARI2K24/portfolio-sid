server {
    listen ${PORT} default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Railway internal DNS is only resolved at nginx startup by default, so a
    # backend redeploy (new container IP) would leave stale cached IPs and 502.
    # Resolve at request time via ${RESOLVER} (injected from /etc/resolv.conf
    # by the Dockerfile CMD) so backend redeploys self-heal within `valid`.
    resolver ${RESOLVER} valid=10s;
    set $backend_upstream http://backend.railway.internal:8080;

    # API + media → backend private network (Railway internal DNS)
    # Backend listens on $PORT (Railway sets 8080); private host resolves via
    # internal DNS without needing explicit port — use 8080 fallback.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /media/ {
        proxy_pass $backend_upstream;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass $backend_upstream;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
